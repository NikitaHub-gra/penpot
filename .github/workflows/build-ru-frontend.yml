name: Build Penpot RU Frontend

on:
  workflow_dispatch:
  push:
    branches:
      - ru-prod-2.17.0

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        run: |
          chmod +x manage.sh
          ./manage.sh pull-devenv

      - name: Build frontend bundle
        run: |
          ./manage.sh build-frontend-bundle

      - name: Build frontend image
        run: |
          ./manage.sh build-frontend-docker-image --local

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        shell: bash
        run: |
          IMAGE_ID=$(docker images penpotapp/frontend --format '{{.ID}}' | head -n1)

          if [ -z "$IMAGE_ID" ]; then
            echo "Penpot frontend image not found"
            exit 1
          fi

          docker tag "$IMAGE_ID" ghcr.io/nikitahub-gra/penpot-frontend-ru:2.17.0
          docker tag "$IMAGE_ID" ghcr.io/nikitahub-gra/penpot-frontend-ru:latest

          docker push ghcr.io/nikitahub-gra/penpot-frontend-ru:2.17.0
          docker push ghcr.io/nikitahub-gra/penpot-frontend-ru:latest
